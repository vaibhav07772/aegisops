# ============================================================
# AegisOps — Full stack (API + Streamlit UI)
#
# Usage:
#   cp .env.example .env   (add GROQ_API_KEY)
#   docker-compose up --build
#
# URLs:
#   API     : http://localhost:8000  (Swagger at /docs)
#   UI      : http://localhost:8501
# ============================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegisops:latest
    container_name: aegisops-api
    command: ["api"]
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
      # Persist DB + models + traces under /app/data (mounted from host)
      DATABASE_URL: "sqlite:///./data/aegisops.db"
      MLFLOW_TRACKING_URI: "sqlite:///./data/mlflow.db"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegisops:latest
    container_name: aegisops-ui
    command: ["ui"]
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      AEGISOPS_API: "http://api:8000"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

networks:
  default:
    name: aegisops-net